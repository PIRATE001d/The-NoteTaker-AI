services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: noter_db
    environment:
      POSTGRES_DB: noter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
